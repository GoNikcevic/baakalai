name: Daily Pattern Audit

on:
  schedule:
    - cron: '0 7 * * *'  # Every day at 7:00 UTC
  workflow_dispatch: {}    # Manual trigger

# The default GITHUB_TOKEN is read-only, so the "Commit ERRORS.md updates"
# push was failing with a 403 every day. Grant the writes this job needs.
permissions:
  contents: write   # push ERRORS.md updates back to the repo
  issues: write     # open/comment the HIGH-severity audit issue

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run pattern audit
        id: audit
        run: |
          node scripts/audit-patterns.js --fix-errors-md > audit-output.txt 2>&1 || true
          echo "findings=$(grep -c '^\s\+\S' audit-output.txt || echo 0)" >> $GITHUB_OUTPUT
          cat audit-output.txt

      - name: Commit ERRORS.md updates
        if: hashFiles('ERRORS.md') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet ERRORS.md || (git add ERRORS.md && git commit -m "docs: daily audit update [automated]" && git push)

      - name: Create issue if HIGH severity found
        if: contains(steps.audit.outputs.findings, 'HIGH')
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit-output.txt', 'utf8');
            const highCount = (output.match(/HIGH/g) || []).length;

            // Check if an open audit issue already exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'audit',
              state: 'open',
            });

            if (issues.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `## Daily Audit — ${new Date().toISOString().split('T')[0]}\n\n${highCount} HIGH severity issue(s) detected.\n\n\`\`\`\n${output.slice(0, 3000)}\n\`\`\``,
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔍 Daily Audit: ${highCount} HIGH severity issue(s)`,
                body: `## Automated Pattern Audit\n\n${output.slice(0, 3000)}`,
                labels: ['audit', 'bug'],
              });
            }
