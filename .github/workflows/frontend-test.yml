name: Frontend tests

# Pourquoi ce workflow : la suite frontend est restée rouge sans que personne
# le voie — 59 échecs sur 137 — parce qu'elle ne tournait nulle part. La CI
# existante (smoke-test.yml) ne couvre que le backend. Une suite que rien
# n'exécute cesse d'être un filet : elle dérive au premier renommage de libellé,
# puis on cesse de la lire.
#
# Contrairement aux tests backend (volontairement exclus de smoke-test.yml car
# ils exigent une base, de l'auth et de vraies clés), les tests frontend sont de
# purs tests jsdom entièrement mockés : ils tournent en CI sans aucune
# dépendance externe.
#
# `staging` est inclus autant que `main` : le flux de travail passe par staging
# d'abord, donc c'est là que la régression doit être vue.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  push:
    branches: [main, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'

jobs:
  test:
    name: Vitest + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 (pas 20) : jsdom → html-encoding-sniffer@6 fait un require()
      # CJS synchrone de @exodus/bytes, un paquet ESM-only (son propre
      # package.json exige justement ^20.19.0 || ^22.12.0 || >=24.0.0). Le
      # support stable de require(esm) n'existe qu'à partir de Node 22.12 —
      # sous Node 20 générique, tous les fichiers de test crashaient au
      # démarrage du worker avant même de s'exécuter (confirmé en local).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

      # Le build attrape ce que les tests ne voient pas : import cassé, JSX
      # déséquilibré, dépendance absente du bundle.
      - name: Build
        working-directory: frontend
        run: npx vite build
