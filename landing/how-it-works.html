<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>baakalai : comment ca marche | how it works</title>
  <meta name="description" content="baakalai lit votre CRM, propose des séquences de relance à branches conditionnelles, envoie depuis votre boîte Gmail ou Outlook et s'arrête dès qu'on répond. Les outils tiers restent optionnels.">
  <link rel="icon" href="assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Geist', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', Menlo, monospace;
      --bg: #050410;
      --ink: #FAFAF9;
      --primary: #6E57FA;
      --lavender: #C4B5FD;
      --lavender-lt: #A998FF;
      --border: #2A2A48;
      --muted: #7A7A78;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01", "cv11";
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
    }
    ::selection { background: var(--primary); color: #FFFFFF; }
    a { color: var(--lavender-lt); text-decoration: none; }
    a:hover { color: #FFFFFF; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp 600ms cubic-bezier(0.2,0.6,0.2,1) both; }

    /* Nav */
.c-nav {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 18px 32px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 50;
      background: linear-gradient(180deg, rgba(5,4,16,0.85) 0%, rgba(5,4,16,0) 100%);
      backdrop-filter: blur(8px);
    }
.c-wordmark {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; letter-spacing: -0.01em; color: #FFFFFF; font-size: 16px;
    }
.c-nav-links { display: flex; gap: 24px; align-items: center; font-size: 13px; }
.c-nav-links a.dim { color: var(--muted); }
.c-nav-links a.dim:hover { color: var(--lavender); }
    /* Violet et non blanc depuis le 26/09 : le CTA doit être le même sur les
       trois pages de la landing. Blanc sur #6E57FA donne 4,77:1, au-dessus
       du seuil AA de 4,5 pour du texte normal. */
.c-cta-pill { background: var(--primary); color: #FFFFFF !important; padding: 8px 14px; border-radius: 999px; font-weight: 600; }
.c-cta-pill:hover { background: #7C68FF; color: #FFFFFF !important; }

.c-lang-switch {
      display: inline-flex; border: 1px solid var(--border); border-radius: 999px;
      padding: 2px; background: rgba(10,8,32,0.6);
    }
.c-lang-switch button {
      color: var(--muted);
      font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em;
      padding: 5px 10px; border-radius: 999px; transition: all 200ms;
    }
.c-lang-switch button.active { background: var(--primary); color: #FFFFFF; }
.c-lang-switch button:hover:not(.active) { color: var(--lavender); }

    /* Legend + controls */
.c-legend {
      display: flex; gap: 10px 18px; flex-wrap: wrap; justify-content: center; align-items: center;
      font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--lavender);
    }
    .c-legend .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
.c-chip {
      padding: 5px 11px; border: 1.5px solid var(--border); border-radius: 999px;
      font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--lavender);
      transition: all 200ms cubic-bezier(0.2,0.6,0.2,1); background: transparent;
    }
.c-chip:hover { border-color: var(--primary); color: #FFFFFF; }

    /* Stage */
.c-stage-scroll { width: 100%; max-width: 1280px; overflow-x: auto; border-radius: 18px; }
.c-stage {
      position: relative; width: 100%; min-width: 960px;
      border-radius: 18px; overflow: hidden; border: 1px solid var(--border);
      box-shadow: 0 40px 100px -30px rgba(110,87,250,0.3), 0 80px 160px -60px rgba(110,87,250,0.15);
      background: radial-gradient(ellipse at 50% 40%, #1a1538 0%, #0a0820 50%, #050410 100%);
    }
.c-stage svg { display: block; width: 100%; height: auto; user-select: none; }
.c-stage [data-node] { cursor: pointer; }

    /* SVG node states */
    .nx-step .body { transition: stroke 200ms, stroke-width 200ms; }
    .nx-step.active .body { stroke: #FFFFFF; stroke-width: 2.5; }
    .nx-step .halo { opacity: 0; transition: opacity 400ms; }
    .nx-step.active .halo { opacity: 1; }
.nx-branch { transition: opacity 300ms; }
.nx-branch.lit text { fill: #FFFFFF; }
    .nx-branch.lit .branch-line { stroke: #FFFFFF; opacity: 0.95; }
    [data-node]:hover .body { stroke: #FFFFFF; }

    /* Caption overlay */
.c-caption { position: absolute; left: 28px; bottom: 22px; pointer-events: none; max-width: 340px; }
    .c-caption .eyebrow { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--lavender-lt); }
    .c-caption .verb { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: #FFFFFF; margin-top: 6px; letter-spacing: -0.005em; }
    .c-caption .detail { font-size: 13px; color: var(--lavender); margin-top: 4px; }

.c-pause { position: absolute; right: 20px; top: 20px; z-index: 4; background: rgba(10,8,32,0.85); backdrop-filter: blur(8px); }

    /* Tooltip */
.c-tip {
      position: absolute; padding: 8px 12px; background: rgba(10,8,32,0.92);
      border: 1px solid var(--primary); border-radius: 8px; pointer-events: none;
      max-width: 250px; z-index: 5; backdrop-filter: blur(8px); display: none;
    }
    .c-tip .k { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lavender-lt); }
    .c-tip .n { font-size: 14px; font-weight: 500; color: #FFFFFF; margin-top: 2px; }
    .c-tip .d { font-size: 11.5px; color: var(--lavender); margin-top: 4px; line-height: 1.4; }

    /* Detail panel */
.c-panel {
      position: absolute; top: 16px; right: 16px; bottom: 16px; width: 380px; max-width: calc(100% - 32px);
      background: rgba(10,8,32,0.94); border: 1px solid var(--primary); border-radius: 14px;
      padding: 24px; overflow-y: auto; z-index: 10; backdrop-filter: blur(14px);
      animation: fadeUp 250ms cubic-bezier(0.2,0.6,0.2,1) both;
    }
    .c-panel .eyebrow { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--lavender-lt); }
.c-panel h3 { font-size: 24px; font-weight: 500; letter-spacing: -0.025em; color: #FFFFFF; margin-top: 6px; line-height: 1.15; }
    .c-panel .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.c-badge {
      font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--lavender);
    }
.c-badge.primary { border-color: var(--primary); background: rgba(110,87,250,0.18); color: #FFFFFF; }
.c-badge.ghost { border-style: dashed; color: var(--muted); }
    .c-panel .sec { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--lavender-lt); margin: 22px 0 8px; }
    .c-panel .role { font-size: 13.5px; color: var(--lavender); line-height: 1.6; }
.c-inter { border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
    .c-inter .act { font-family: var(--font-mono); font-size: 11.5px; color: #FFFFFF; }
    .c-inter .agent { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--lavender-lt); border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; margin-left: 8px; }
    .c-inter .why { font-size: 12px; color: var(--lavender); margin-top: 4px; }
.c-agents-row { display: flex; gap: 6px; flex-wrap: wrap; }
.c-agents-row span { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--lavender); border: 1px solid var(--border); border-radius: 999px; padding: 4px 9px; }
.c-panel-close {
      position: absolute; top: 14px; right: 14px; width: 28px; height: 28px;
      border: 1px solid var(--border); border-radius: 50%; color: var(--lavender);
      font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
.c-panel-close:hover { border-color: var(--primary); color: #FFFFFF; }

    /* Sections */
.c-hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 110px; }
.c-hero-copy { text-align: center; max-width: 920px; padding: 0 32px; margin-bottom: 28px; }
.c-eyebrow { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--lavender-lt); }
.c-hero h1 { font-size: clamp(36px, 5.5vw, 66px); font-weight: 500; letter-spacing: -0.035em; color: #FFFFFF; line-height: 1.04; margin: 14px 0 16px; }
.c-hero h1 em { font-style: normal; color: var(--lavender-lt); }
.c-hero p { font-size: 17px; color: var(--lavender); line-height: 1.55; max-width: 680px; margin-inline: auto; }
.c-hint { margin-top: 18px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--lavender-lt); text-align: center; line-height: 1.6; padding: 0 24px; }
.c-scroll-hint { display: none; }

.c-phil { padding: 120px 32px; max-width: 1240px; margin: 0 auto; }
.c-phil h2 { font-size: clamp(28px, 3.5vw, 44px); font-weight: 500; letter-spacing: -0.03em; color: #FFFFFF; line-height: 1.08; margin: 14px 0 0; max-width: 880px; }
.c-phil h2 em { font-style: normal; color: var(--lavender-lt); }
.c-agent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; margin-top: 60px; }
.c-agent-card { padding: 24px; background: rgba(110,87,250,0.05); border: 1px solid var(--border); border-radius: 14px; }
    .c-agent-card .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--lavender); margin-bottom: 16px; }
    .c-agent-card .k { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lavender-lt); }
    .c-agent-card .n { font-size: 22px; font-weight: 500; letter-spacing: -0.025em; color: #FFFFFF; margin-top: 6px; line-height: 1.15; }
    .c-agent-card .t { font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; color: var(--lavender-lt); margin-top: 8px; line-height: 1.4; }
    .c-agent-card .d { font-size: 13px; color: var(--lavender); margin-top: 14px; line-height: 1.55; }

.c-cta { padding: 80px 32px 140px; text-align: center; }
.c-cta h3 { font-size: clamp(28px, 4vw, 48px); font-weight: 500; letter-spacing: -0.03em; color: #FFFFFF; margin: 0 0 32px; max-width: 720px; margin-inline: auto; line-height: 1.1; }
    .c-cta .btn { display: inline-block; padding: 14px 28px; background: #FFFFFF; color: #0A0A0A; border-radius: 999px; font-size: 15px; font-weight: 500; }
    .c-cta .note { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 20px; }

    /* Responsive */
    @media (max-width: 768px) {
.c-nav { padding: 14px 16px; }
.c-nav-links { gap: 12px; }
.c-nav-links a:not(.c-cta-pill) { display: none; }
.c-hero { padding-top: 96px; }
.c-scroll-hint { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-align: center; margin-bottom: 8px; }
.c-panel {
        position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: 100%;
        max-height: 72vh; border-radius: 14px 14px 0 0; border-left: none; border-right: none; border-bottom: none;
      }
.c-caption { max-width: 250px; }
.c-phil { padding: 80px 20px; }
.c-cta { padding: 60px 20px 100px; }
    }
  </style>
</head>
