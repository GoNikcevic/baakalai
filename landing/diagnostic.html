.diag-provider.off { background: var(--paper-2); color: var(--grey-400); }
.diag-headline { font-size: clamp(21px, 3.2vw, 27px); font-weight: 700; letter-spacing: -0.02em; margin: 10px 0 14px; }
.diag-range {
      font-family: var(--font-mono); font-size: clamp(30px, 6vw, 46px); font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.05; color: var(--primary); margin-bottom: 6px;
    }
.diag-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.diag-pill {
      font-size: 12.5px; padding: 5px 11px; border-radius: 999px;
      border: 1px solid var(--border-strong); background: var(--paper-2); color: var(--grey-700);
    }
.diag-pill-accent { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-deep); }
.diag-bar-row {
      display: grid; grid-template-columns: minmax(110px, 1.2fr) 3fr 54px;
      align-items: center; gap: 12px; font-size: 13.5px; padding: 7px 0;
    }
.diag-bar-track { height: 7px; border-radius: 999px; background: var(--paper-2); overflow: hidden; }
.diag-bar-fill { display: block; height: 7px; border-radius: 999px; background: var(--primary); }
.diag-bar-val { font-family: var(--font-mono); font-size: 12.5px; text-align: right; }
.diag-op {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      padding: 11px 0; border-top: 1px solid var(--paper-3); font-size: 14px;
    }
.diag-op:first-of-type { border-top: none; }
.diag-op-who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.diag-op-why { font-size: 12px; color: var(--grey-500); }
.diag-op-amt { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }
.diag-locked {
      border: 1px dashed var(--border-strong); border-radius: 14px;
      padding: 18px 26px; margin-bottom: 16px; background: var(--paper-2);
    }
.diag-share { display: flex; gap: 8px; flex-wrap: wrap; }
.diag-cta-card { border: 1px solid var(--primary); text-align: center; }
.diag-center { text-align: center; }
.diag-muted { color: var(--grey-500); font-size: 13px; }
    details.diag-guide { margin-top: 10px; font-size: 13px; color: var(--grey-500); }
    details.diag-guide summary { cursor: pointer; }
    details.diag-guide ol { margin: 8px 0 0; padding-left: 18px; }
.diag-spin { text-align: center; padding: 48px 24px; color: var(--grey-500); }

      function t(key, vars) {
        var s = (T[lang] || T.fr)[key] || key;
        if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
        return s;
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function money(n) {
        if (!n) return '0 €';
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M €';
        if (n >= 1000) return Math.round(n / 1000) + 'k €';
        return Math.round(n) + ' €';
      }

      var body = document.getElementById('diagBody');
      var state = { report: null, id: null, provider: 'pipedrive' };

      function renderHead() {
        document.documentElement.lang = lang;
        document.getElementById('diagTitle').textContent = t('title');
        document.getElementById('diagSub').textContent = t('subtitle');
        document.getElementById('navCta').textContent = t('navCta');
        document.querySelectorAll('.lang-toggle button').forEach(function (b) {
          b.classList.toggle('active', b.dataset.lang === lang);
        });
      }

      function renderForm(err) {
        var hs = state.provider === 'hubspot';
        renderHead();
        var oauthBtn = function (p) {
          return '<a class="btn btn-accent" style="width:100%;justify-content:center;padding:12px;font-size:15px;margin-bottom:10px;" href="' + API + '/api/public/diagnostic/oauth/' + p + '/start?lang=' + lang + '">' +

        };
        body.innerHTML =
          '<form class="diag-card" id="diagForm">' +
            oauthBtn('pipedrive') + oauthBtn('hubspot') + oauthBtn('salesforce') +
            '<div class="diag-note" style="margin-top:0;">' + esc(t('oauthGdpr')) + '</div>' +
            (err ? '<div class="diag-err">' + esc(err) + '</div>' : '') +
            '<details class="diag-guide" style="margin-top:14px;"><summary>' + esc(t('orApiKey')) + '</summary>' +
              '<div style="margin-top:12px;">' +
              '<div class="diag-provider">' + ['pipedrive', 'hubspot'].map(function (p) { return '<span class="' + (state.provider === p ? 'on' : 'off') + '" data-provider="' + p + '">' + esc(t(p)) + '</span>'; }).join('') + '</div>' +

              '<input class="diag-input" id="diagToken" type="password" placeholder="' + esc(t(hs ? 'tokenPlaceholderHubspot' : 'tokenPlaceholder')) + '" autocomplete="off">' +

              '</ol></details>' +
              '<button type="submit" class="btn btn-accent" style="width:100%;margin-top:14px;padding:12px;font-size:15px;justify-content:center;">' + esc(t('scanBtn')) + '</button>' +
              '<div class="diag-note">' + esc(t('gdpr')) + '</div>' +
              '</div>' +
            '</details>' +
            '<div class="diag-note" style="margin-top:14px;">' + esc(t('otherCrm')) +
              ' <a href="https://app.baakal.ai/?ref=diagnostic" style="color:var(--primary);font-weight:600;text-decoration:none;">' + esc(t('otherCrmCta')) + '</a></div>' +
          '</form>';
        document.getElementById('diagForm').addEventListener('submit', onScan);
        document.querySelectorAll('.diag-provider span').forEach(function (el) {
          el.addEventListener('click', function () {
            if (state.provider !== el.dataset.provider) { state.provider = el.dataset.provider; renderForm(); }
          });
        });
      }

      function onScan(e) {
        e.preventDefault();
        var token = document.getElementById('diagToken').value.trim();
        if (token.length < 8) return;
        renderHead();
        body.innerHTML = '<div class="diag-card diag-spin">' + esc(t('scanning')) + '</div>';
        fetch(API + '/api/public/diagnostic', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: state.provider, apiToken: token, lang: lang }),
        }).then(function (res) {
          if (!res.ok) {
            return res.json().catch(function () { return {}; }).then(function (b) {
              renderForm(b.error === 'rate_limited' ? t('errRate') : b.error === 'invalid_token' ? t('errToken') : t('errGeneric'));
            });
          }
          return res.json().then(function (data) {
            if (data.legacy) {
              body.innerHTML = '<div class="diag-card diag-center"><div style="font-weight:600;margin-bottom:6px;">' + esc(t('legacyTitle')) + '</div>' +
                '<div class="diag-muted" style="margin-bottom:14px;">' + esc(t('legacyBody')) + '</div>' +
                '<a href="diagnostic.html" class="btn btn-accent">' + esc(t('runYours')) + '</a></div>';
              return;
            }
            state.report = data.report; state.id = data.id;
            renderReport(false);
          });
        }).catch(function () { renderForm(t('errGeneric')); });

          '<div class="diag-note" style="margin-top:12px;">' + esc(t('scoreNote')) + '</div>' +
        '</div>';

      function notQuantifiableCard(r) {
        return '<div class="diag-card">' +
          '<div class="diag-muted" style="font-size:13px;">' +
            esc(t('readLine', { deals: r.context.dealsRead, opps: r.opportunityCount })) + '</div>' +
          '<div class="diag-headline">' + esc(t('notQuantTitle')) + '</div>' +
          '<div style="font-size:15px;margin-top:8px;">' +
            esc(t('notQuantBody', { count: r.opportunityCount, missing: r.context.countWithoutValue })) + '</div>' +
        '</div>';
      }

      function dimsHtml(r) {
        var rows = DIMS.map(function (key) {
          var d = r.dimensions[key] || { evaluated: false };
          if (!d.evaluated) {
            return '<div class="diag-bar-row">' +
              '<span>' + esc(t('dim_' + key)) + '</span>' +
              '<span class="diag-bar-track"></span>' +
              '<span class="diag-bar-val diag-muted">' + esc(t('dimNotEvaluated')) + '</span>' +
            '</div>';
          }
          return '<div class="diag-bar-row">' +
            '<span>' + esc(t('dim_' + key)) + '</span>' +
            '<span class="diag-bar-track"><span class="diag-bar-fill" style="width:' + Math.min(d.subScore, 100) + '%;"></span></span>' +
            '<span class="diag-bar-val">' + d.subScore + '</span>' +
          '</div>';
        }).join('');
        return '<div class="diag-card">' +
          '<div style="font-weight:600;margin-bottom:12px;">' + esc(t('dimsTitle')) + '</div>' + rows +
        '</div>';
      }

      function reasonLabel(code) {
        var key = 'reason_' + code;
        var label = t(key);
        return label === key ? '' : label;
      }

      function topHtml(r) {
        if (!r.top || !r.top.length) return '';
        var rows = r.top.map(function (o) {
          var reasons = (o.reasonCodes || []).map(reasonLabel).filter(Boolean).join(' · ');
          var who = o.company
            ? '<strong>' + esc(o.company) + '</strong>' + (o.name ? ' · ' + esc(o.name) : '')
            : '<strong>' + esc(t('topAnon')) + '</strong>';
          return '<div class="diag-op">' +
            '<span class="diag-op-who">' + who +
              '<span class="diag-op-why">' + esc(t('daysInactive', { days: o.daysInactive })) +
                (reasons ? ' · ' + esc(reasons) : '') + '</span>' +
            '</span>' +
            '<span class="diag-op-amt">' + esc(money(o.expectedValue)) + '</span>' +
          '</div>';
        }).join('');
        return '<div class="diag-card">' +
          '<div style="font-weight:600;margin-bottom:10px;">' + esc(t('topTitle')) + '</div>' + rows +
        '</div>';
      }

      function lockedHtml(r) {
        if (!r.lockedCount) return '';
        return '<div class="diag-locked">' +
          '<div style="font-weight:600;">' + esc(t('lockedTitle', { count: r.lockedCount })) + '</div>' +
          '<div class="diag-muted" style="font-size:13px;margin-top:4px;">' + esc(t('lockedBody')) + '</div>' +
        '</div>';
      }

      function notesHtml(r) {
        var notes = [];
        if (r.context.countEstimatedValue) notes.push(t('noteEstimated', { count: r.context.countEstimatedValue }));
        if (r.context.truncated) notes.push(t('noteTruncated'));
        if (!notes.length) return '';
        return '<div class="diag-note" style="margin-top:-4px;">' + notes.map(esc).join(' ') + '</div>';
      }

      function renderReport(shared) {
        renderHead();
        var r = state.report;
        var html = '';
        if (shared) html += '<div class="diag-center diag-muted" style="font-size:12px;margin-bottom:12px;">' + esc(t('sharedBadge')) + '</div>';

        if (!r.context || !r.context.dealsRead) {
          html += '<div class="diag-card diag-center"><div style="font-weight:600;margin-bottom:6px;">' + esc(t('emptyTitle')) + '</div>' +
                  '<div class="diag-muted">' + esc(t('emptyBody')) + '</div></div>';
          body.innerHTML = html;
          return;
        }

        html += r.quantifiable ? scoreCard(r) : notQuantifiableCard(r);
        html += notesHtml(r);
        html += dimsHtml(r);
        html += topHtml(r);
        html += lockedHtml(r);

        html += '<div class="diag-card diag-cta-card diag-center">' +
          '<a href="https://app.baakal.ai/?ref=diagnostic" class="btn btn-accent" style="padding:12px 22px;font-size:15px;">' + esc(t('cta')) + '</a>' +
          '<div class="diag-muted" style="font-size:12px;margin-top:10px;">' + esc(t('ctaNote')) + '</div>' +
        '</div>';

        if (!shared && state.id) {
          html += '<div class="diag-card"><div style="font-weight:600;margin-bottom:10px;">' + esc(t('shareTitle')) + '</div>' +
            '<div class="diag-share">' +
              '<button class="btn btn-ghost" id="diagCopy" style="font-size:13px;">' + esc(t('copyLink')) + '</button>' +
              '<a class="btn btn-ghost" style="font-size:13px;" target="_blank" rel="noreferrer" id="diagLi">' + esc(t('shareLinkedin')) + '</a>' +
              '<button class="btn btn-ghost" id="diagPng" style="font-size:13px;">' + esc(t('downloadImg')) + '</button>' +
            '</div></div>';
        }
        if (shared) {
          html += '<div class="diag-center" style="margin-top:4px;"><a href="diagnostic.html" class="btn btn-accent">' + esc(t('runYours')) + '</a></div>';
        }

        body.innerHTML = html;

        if (!shared && state.id) {
          var shareUrl = 'https://baakal.ai/diagnostic?r=' + state.id;
          document.getElementById('diagLi').href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(shareUrl);
          document.getElementById('diagCopy').addEventListener('click', function () {
            var btn = this;
            navigator.clipboard.writeText(shareUrl).then(function () {
              btn.textContent = t('copied');
              setTimeout(function () { btn.textContent = t('copyLink'); }, 2000);
            }).catch(function () {});
          });
          document.getElementById('diagPng').addEventListener('click', function () { downloadImage(r); });
        }
      }

      function downloadImage(r) {
        function escXml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        var head = t('imgHead', { low: money(r.expectedLow), high: money(r.expectedHigh) });
        var sub = t('imgScore', { hrs: r.hrs, conf: r.confidence });
        var noVal = t('imgOpps', { opps: r.opportunityCount });
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630">' +
          '<rect width="1200" height="630" fill="#FAFAF9"/>' +
          '<rect width="1200" height="8" fill="#6E57FA"/>' +
          '<text x="80" y="120" font-family="Arial, sans-serif" font-size="34" fill="#666">' + escXml(t('imgTagline')) + '</text>' +
          '<text x="80" y="260" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#1a1a1a">' + escXml(head) + '</text>' +
          '<text x="80" y="340" font-family="Arial, sans-serif" font-size="40" fill="#444">' + escXml(sub) + '</text>' +
          (noVal ? '<text x="80" y="410" font-family="Arial, sans-serif" font-size="32" fill="#DC2626">' + escXml(noVal) + '</text>' : '') +
          '<text x="80" y="540" font-family="Arial, sans-serif" font-size="30" fill="#6E57FA" font-weight="bold">baakal.ai/diagnostic</text>' +
        '</svg>';
        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          canvas.width = 1200; canvas.height = 630;
          canvas.getContext('2d').drawImage(img, 0, 0);
          var a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'diagnostic-crm-baakal.png';
          a.click();
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }

      function loadShared(id, k) {
        renderHead();
        body.innerHTML = '<div class="diag-card diag-spin">' + esc(t('scanning')) + '</div>';
        fetch(API + '/api/public/diagnostic/' + encodeURIComponent(id) + (k ? '?k=' + encodeURIComponent(k) : '')).then(function (res) {
          if (!res.ok) {
            body.innerHTML = '<div class="diag-card diag-center"><p>' + esc(t('notFound')) + '</p>' +
              '<a href="diagnostic.html" class="btn btn-accent">' + esc(t('runYours')) + '</a></div>';
            return;
          }
          return res.json().then(function (data) {
            state.report = data.report;
            if (data.isOwner) { state.id = id; renderReport(false); }
            else renderReport(true);
          });
        }).catch(function () {
          body.innerHTML = '<div class="diag-card diag-center"><p>' + esc(t('notFound')) + '</p></div>';
        });
      }

      document.querySelectorAll('.lang-toggle button').forEach(function (b) {
        b.addEventListener('click', function () {
          lang = b.dataset.lang;
          localStorage.setItem(STORE_KEY, lang);
          init();
        });
      });

      var qs = new URLSearchParams(window.location.search);
      var sharedId = qs.get('r');
      var ownerKey = qs.get('k');
      var oauthError = qs.get('oauth_error');
      function init() {
        if (sharedId && /^[0-9a-f-]{36}$/i.test(sharedId)) loadShared(sharedId, ownerKey);
        else if (state.report && state.id) renderReport(false);
        else renderForm(oauthError ? t('errOauth') : null);
      }
      init();
    })();
  </script>
</body>
</html>
